# A "just works" starter scenario used by README quickstart commands.
#
# Notes:
# - `at_ms` must be < `duration_ms` and aligned to `tick_ms`.
# - Digital/analog input IDs are numeric (0 => DI0/AI0, 10 => DI10, ...).
seed: 42
tick_ms: 10
duration_ms: 6000

inputs:
  # Press and release `start_button` (wired to X10 => DI10 in examples/assembly_station.plc).
  - at_ms: 0
    set:
      digital_inputs:
        10: true
  - at_ms: 50
    set:
      digital_inputs:
        10: false

  # Drive the rest of the assembly_station example through a "happy path" cycle by scripting sensor edges.
  # X0..X9 map to DI0..DI9.
  - at_ms: 100
    set:
      digital_inputs:
        0: true   # sensor_left_arrive
  - at_ms: 120
    set:
      digital_inputs:
        1: true   # sensor_right_arrive

  - at_ms: 200
    set:
      digital_inputs:
        2: true   # sensor_push_L_ext
  - at_ms: 220
    set:
      digital_inputs:
        4: true   # sensor_push_R_ext

  - at_ms: 300
    set:
      digital_inputs:
        6: true   # sensor_press_ext
  - at_ms: 350
    set:
      digital_inputs:
        7: true   # sensor_press_ret

  - at_ms: 450
    set:
      digital_inputs:
        3: true   # sensor_push_L_ret
  - at_ms: 470
    set:
      digital_inputs:
        5: true   # sensor_push_R_ret

  - at_ms: 600
    set:
      digital_inputs:
        8: true   # sensor_eject_ext
  - at_ms: 650
    set:
      digital_inputs:
        9: true   # sensor_eject_ret
