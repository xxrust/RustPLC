# A "just works" starter scenario used by README quickstart commands.
#
# Notes:
# - `at_ms` must be < `duration_ms` and aligned to `tick_ms`.
# - For `rust_plc sim-plc` / `no-board-gate` / `scenario-validate`, you may use either:
#   - numeric IDs (e.g. `10` for DI10), or
#   - device names from the `.plc` topology (e.g. `start_button`, `sensor_left_arrive`).
seed: 42
tick_ms: 10
duration_ms: 6000

inputs:
  # Press and release `start_button` (wired to X10 => DI10 in examples/assembly_station.plc).
  - at_ms: 0
    set:
      digital_inputs:
        start_button: true
  - at_ms: 50
    set:
      digital_inputs:
        start_button: false

  # Drive the rest of the assembly_station example through a "happy path" cycle by scripting sensor edges.
  - at_ms: 100
    set:
      digital_inputs:
        sensor_left_arrive: true
  - at_ms: 120
    set:
      digital_inputs:
        sensor_right_arrive: true

  - at_ms: 200
    set:
      digital_inputs:
        sensor_push_L_ext: true
  - at_ms: 220
    set:
      digital_inputs:
        sensor_push_R_ext: true

  - at_ms: 300
    set:
      digital_inputs:
        sensor_press_ext: true
  - at_ms: 350
    set:
      digital_inputs:
        sensor_press_ret: true

  - at_ms: 450
    set:
      digital_inputs:
        sensor_push_L_ret: true
  - at_ms: 470
    set:
      digital_inputs:
        sensor_push_R_ret: true

  - at_ms: 600
    set:
      digital_inputs:
        sensor_eject_ext: true
  - at_ms: 650
    set:
      digital_inputs:
        sensor_eject_ret: true
