tick_ms: 10
duration_ms: 120

inputs:
  - at_ms: 0
    set:
      digital_inputs:
        0: false

forces:
  # Start sequence by forcing DI0 high.
  - at_ms: 0
    set:
      digital_inputs:
        0: true

  # Override outputs while program is trying to toggle them.
  - at_ms: 0
    set:
      digital_outputs:
        0: false
      analog_outputs:
        0: 1.0

  # Release output force to let program writes take effect again.
  - at_ms: 60
    set:
      digital_outputs:
        0: null
      analog_outputs:
        0: null

