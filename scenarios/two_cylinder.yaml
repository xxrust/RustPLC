# Scenario for examples/two_cylinder.plc
#
# Key idea:
# - Pulse the start button (DI4) to begin one init cycle.
# - Then drive sensors in order over time so the state machine does not
#   "complete instantly" and loop within the same tick.
seed: 1
tick_ms: 10
duration_ms: 3000

inputs:
  - at_ms: 0
    set:
      digital_inputs:
        0: false # sensor_A_ext (X0)
        1: false # sensor_A_ret (X1)
        2: false # sensor_B_ext (X2)
        3: false # sensor_B_ret (X3)
        4: false # start_button (X4)

  # Press start.
  - at_ms: 0
    set:
      digital_inputs:
        4: true
  - at_ms: 50
    set:
      digital_inputs:
        4: false

  # A extends.
  - at_ms: 200
    set:
      digital_inputs:
        0: true
        1: false

  # A retracts.
  - at_ms: 700
    set:
      digital_inputs:
        0: false
        1: true

  # B extends.
  - at_ms: 1200
    set:
      digital_inputs:
        2: true
        3: false

  # B retracts.
  - at_ms: 1700
    set:
      digital_inputs:
        2: false
        3: true
