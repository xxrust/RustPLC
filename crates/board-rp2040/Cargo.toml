[package]
name = "board-rp2040"
version = "0.1.0"
edition = "2021"
publish = false

# This package is a tiny firmware skeleton for Raspberry Pi Pico (RP2040).
# It also builds on host targets (prints build guidance), so workspace builds stay green.

[dependencies]
io-traits = { path = "../io-traits" }
runtime-core = { path = "../runtime-core" }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
rp-pico = "0.9"
rp2040-boot2 = "0.3"
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2.7" }
pio = "0.2.1"
pio-proc = "0.2.2"

[build-dependencies]
toml = "0.8"
