[package]
name = "board-renode-stm32"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
io-traits = { path = "../io-traits" }
runtime-core = { path = "../runtime-core" }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1"
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f407"] }
nb = "1"

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[package.metadata.rust-analyzer]
rustc_private = false
