name: rustplc-no-board-gate

on:
  push:
  pull_request:

jobs:
  no-board-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Project check
        run: cargo run --release --bin rust_plc -- project-check rustplc.bundle.toml --scenario scenarios/nominal/normal.yaml --out-dir out/project_check/normal --output json
