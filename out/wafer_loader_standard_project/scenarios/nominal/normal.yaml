tick_ms: 10
duration_ms: 1500
inputs:
  # 基线输入：自动模式有效，旋臂已在原点，测片台可接收；真空/视觉等非闭合输入由场景驱动。
  - at_ms: 0
    set:
      digital_inputs:
        3: true
        12: true
        15: true
        17: true
        18: true
        19: true
        20: true
        22: true
        23: true
        25: true
        27: true
        29: true
        31: true
  # 操作者按下启动按钮，front-door 语义由程序中的 rising_edge(start_button) 消费。
  - at_ms: 50
    set:
      digital_inputs:
        0: true
  # 操作者松开启动按钮，防止后续周期误读为保持输入。
  - at_ms: 100
    set:
      digital_inputs:
        0: false
  # 滑轨有片窗口：只表达外部存在检测，不手写气缸反馈。
  - at_ms: 130
    set:
      digital_inputs:
        13: true
  # 旋臂取片后滑轨取料位变空，防止同一高电平被重复消费。
  - at_ms: 260
    set:
      digital_inputs:
        13: false
  # 辨相台有片窗口：辨相合格后允许转运任务接手。
  - at_ms: 340
    set:
      digital_inputs:
        14: true
  # 转运吸嘴取片后辨相台变空，防止同一高电平被重复转运。
  - at_ms: 420
    set:
      digital_inputs:
        14: false
forces: []
