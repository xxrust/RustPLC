interface:
  display_name: "RustPLC DSL 交付"
  short_description: "交付、修复并验证 RustPLC DSL source set 与 scaffold 项目，支持单文件 `.plc` 和多文件 `.bundle.toml` + fragments。"
  default_prompt: "Use $plc-gen to deliver or repair RustPLC DSL sources or a scaffolded RustPLC project, preserving single-file or multi-file source boundaries and providing real validation commands."

policy:
  allow_implicit_invocation: true
