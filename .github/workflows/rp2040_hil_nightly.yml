name: rp2040-hil-nightly

on:
  workflow_dispatch:
    inputs:
      run_hil:
        description: "Run self-hosted HIL gate"
        required: false
        type: boolean
        default: false
      mount:
        description: "RP2040 UF2 mount path (e.g. /media/RPI-RP2)"
        required: false
        type: string
      port:
        description: "Serial port (e.g. /dev/ttyACM0)"
        required: false
        type: string
      duration:
        description: "Log capture duration in seconds"
        required: false
        type: string
  schedule:
    - cron: "0 1 * * *"

concurrency:
  group: rp2040-hil-nightly
  cancel-in-progress: true

jobs:
  hil-disabled-notice:
    if: |
      (github.event_name == 'schedule' && vars.ENABLE_SELF_HOSTED_HIL_NIGHTLY != 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_hil != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: HIL gate disabled
        run: |
          echo "Self-hosted HIL gate is currently disabled."
          echo "For nightly schedule, set repository variable ENABLE_SELF_HOSTED_HIL_NIGHTLY=true."
          echo "For manual dispatch, set input run_hil=true."

  hil-gate:
    if: |
      (github.event_name == 'schedule' && vars.ENABLE_SELF_HOSTED_HIL_NIGHTLY == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_hil == 'true')
    # Requires a physically connected RP2040 board.
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      DEFAULT_MOUNT: /media/RPI-RP2
      DEFAULT_PORT: /dev/ttyACM0
      DEFAULT_DURATION: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - name: Ensure elf2uf2-rs
        run: cargo install elf2uf2-rs --locked || true
      - name: Resolve runtime args
        id: args
        run: |
          MOUNT="${{ github.event.inputs.mount }}"
          PORT="${{ github.event.inputs.port }}"
          DURATION="${{ github.event.inputs.duration }}"
          if [[ -z "$MOUNT" ]]; then MOUNT="${DEFAULT_MOUNT}"; fi
          if [[ -z "$PORT" ]]; then PORT="${DEFAULT_PORT}"; fi
          if [[ -z "$DURATION" ]]; then DURATION="${DEFAULT_DURATION}"; fi
          echo "mount=$MOUNT" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
      - name: Run RP2040 daily HIL gate (motion + fail-safe bundles)
        run: |
          scripts/rp2040_hil_daily_gate.sh \
            --mount "${{ steps.args.outputs.mount }}" \
            --port "${{ steps.args.outputs.port }}" \
            --duration "${{ steps.args.outputs.duration }}" \
            --out-root out/ci_hil_daily_gate \
            --bundle
      - name: Upload HIL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp2040-hil-gate-${{ github.run_id }}
          path: out/ci_hil_daily_gate
          if-no-files-found: warn
