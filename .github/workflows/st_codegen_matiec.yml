name: st-codegen-matiec

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  st-codegen-matiec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MATIEC (iec2c)
        run: |
          sudo apt-get update
          if sudo apt-get install -y matiec; then
            echo "[ST-MATIEC] Installed MATIEC from apt."
          else
            echo "[ST-MATIEC] apt package unavailable, building MATIEC from source."
            sudo apt-get install -y autoconf automake bison build-essential flex git libtool
            workdir="$(mktemp -d)"
            git clone --depth 1 https://github.com/beremiz/matiec.git "$workdir/matiec"
            cd "$workdir/matiec"
            ./autogen.sh
            ./configure
            make -j"$(nproc)"
            sudo make install
            sudo ldconfig
          fi
      - name: Verify iec2c availability
        run: |
          iec2c --version || iec2c --help
      - name: Generate ST and compile with MATIEC
        run: |
          bash scripts/st_codegen_matiec_gate.sh out/ci_st_codegen_matiec
