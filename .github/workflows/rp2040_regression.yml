name: rp2040-regression

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  script-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Script mode/EOL preflight
        run: scripts/ci_script_contract_preflight.sh
      - name: Block legacy connected_to regressions
        run: scripts/ci_no_connected_to_regression.sh

  stage3-runtime-dev-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage-3 runtime/dev contract gates
        run: scripts/stage3_runtime_dev_gate.sh

  concurrent-runtime-verification-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Concurrent runtime + verification gate
        run: bash scripts/concurrent_runtime_verification_gate.sh

  workspace-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cam regression gate
        run: bash scripts/cam_regression_gate.sh
      - name: Cargo test (workspace)
        run: cargo test --workspace

  topology-perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Topology performance baseline gate
        run: python3 scripts/topology_perf_gate.py --output human

  rp2040-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - name: Cross build board firmware
        run: cargo build -p board-rp2040 --target thumbv6m-none-eabi --release

  trace-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Golden gate should pass
        run: |
          cargo run --release --bin rust_plc -- trace-diff \
            --sil examples/trace_golden/sil_trace.jsonl \
            --board examples/trace_golden/board_trace_match.jsonl \
            --out out/ci_trace_match_report.json \
            --fail-on-mismatch
      - name: PIL script should pass with golden board log
        run: |
          scripts/pil_trace_gate.sh \
            --sil examples/trace_golden/sil_trace.jsonl \
            --out-dir out/ci_pil_gate \
            --board-log examples/trace_golden/board_log_match.log
      - name: PIL semantic baselines (.plc + scenario)
        run: |
          scripts/pil_semantic_baseline.sh \
            --cases-dir examples/pil_baselines \
            --out-root out/ci_pil_semantic_baselines
