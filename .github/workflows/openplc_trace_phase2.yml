name: openplc-trace-phase2

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  openplc-trace-phase2-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify python availability
        run: python3 --version
      - name: Run OpenPLC phase-2 trace gate
        run: |
          bash scripts/openplc_trace_phase2_gate.sh \
            examples/openplc_trace_phase2 \
            out/ci_openplc_trace_phase2
