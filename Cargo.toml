[package]
name = "rust_plc"
version = "0.1.0"
edition = "2024"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
io-traits = { path = "crates/io-traits" }
runtime-core = { path = "crates/runtime-core" }
codegen = { path = "crates/codegen" }
sim = { path = "crates/sim" }
rustplc-device-semantics = { path = "crates/device-semantics" }
thiserror = "1"
z3 = { version = "0.20", optional = true }
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
bumpalo = "3"
self_cell = "1"
toml = "0.8"
tungstenite = "0.30"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tower-lsp = "0.20"

[features]
default = []
z3-solver = ["dep:z3"]
z3-gh-release = ["z3-solver", "z3/gh-release"]
z3-vcpkg = ["z3-solver", "z3/vcpkg"]
z3-vendored = ["z3-solver", "z3/vendored"]

[workspace]
resolver = "2"
members = [
  "crates/io-traits",
  "crates/io-modbus",
  "crates/io-ethercat",
  "crates/device-semantics",
  "crates/runtime-core",
  "crates/sim",
  "crates/board-rp2040",
  "crates/board-esp32",
  "crates/board-renode-stm32",
  "crates/codegen",
  "crates/web-server",
]
