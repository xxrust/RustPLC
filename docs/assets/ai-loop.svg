<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a4a6a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#cf222e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2ea44f"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e8630a"/>
    </marker>
  </defs>

  <rect width="800" height="420" rx="12" fill="#fafbfc" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Title -->
  <rect x="290" y="8" width="220" height="28" rx="14" fill="#8250df"/>
  <text x="400" y="27" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">AI for AI 工程闭环</text>

  <!-- Step 1: AI Agent -->
  <rect x="30" y="55" width="170" height="70" rx="12" fill="#f5f0ff" stroke="#8250df" stroke-width="2"/>
  <text x="115" y="78" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#8250df">AI Agent</text>
  <text x="115" y="94" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#57606a">生成 .plc 文件</text>
  <text x="115" y="108" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#57606a">拓扑 + 约束 + 任务</text>

  <line x1="200" y1="90" x2="250" y2="90" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Compiler -->
  <rect x="255" y="55" width="170" height="70" rx="12" fill="#e8f4fd" stroke="#0969da" stroke-width="2"/>
  <text x="340" y="78" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#0969da">RustPLC 编译器</text>
  <text x="340" y="94" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#57606a">Parser → AST → IR</text>
  <text x="340" y="108" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#57606a">语义闭合</text>

  <line x1="425" y1="90" x2="475" y2="90" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Verification -->
  <rect x="480" y="50" width="170" height="80" rx="12" fill="#cf222e" stroke="#a40e26" stroke-width="2"/>
  <text x="565" y="75" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">四引擎验证</text>
  <text x="565" y="92" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="rgba(255,255,255,0.85)">Safety · Liveness</text>
  <text x="565" y="106" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="rgba(255,255,255,0.85)">Timing · Causality</text>
  <text x="565" y="120" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="rgba(255,255,255,0.85)">数学证明</text>

  <!-- Decision diamond -->
  <polygon points="700,90 730,65 760,90 730,115" fill="#fff" stroke="#4a4a6a" stroke-width="2"/>
  <text x="730" y="94" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a2e">?</text>
  <line x1="650" y1="90" x2="700" y2="90" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FAIL path -->
  <line x1="730" y1="115" x2="730" y2="175" stroke="#cf222e" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="660" y="135" width="50" height="20" rx="10" fill="#cf222e"/>
  <text x="685" y="149" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff">FAIL</text>

  <!-- Error report -->
  <rect x="630" y="180" width="160" height="65" rx="12" fill="#fce4ec" stroke="#cf222e" stroke-width="2"/>
  <text x="710" y="203" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#cf222e">结构化错误</text>
  <text x="710" y="219" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#57606a">行号 + 错误码</text>
  <text x="710" y="233" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#57606a">修复建议</text>

  <!-- Loop back arrow -->
  <line x1="630" y1="212" x2="200" y2="212" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="200" y1="212" x2="200" y2="145" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="200" y1="145" x2="115" y2="145" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="115" y1="145" x2="115" y2="125" stroke="#cf222e" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="400" y="205" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#8b949e" font-style="italic">Agent 自动修复 → 重新编译</text>

  <!-- PASS path -->
  <line x1="760" y1="90" x2="780" y2="90" stroke="#2ea44f" stroke-width="2.5"/>
  <line x1="780" y1="90" x2="780" y2="50" stroke="#2ea44f" stroke-width="2.5"/>
  <rect x="755" y="68" width="45" height="20" rx="10" fill="#2ea44f"/>
  <text x="777" y="82" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff">PASS</text>

  <line x1="780" y1="50" x2="780" y2="30" stroke="#2ea44f" stroke-width="2"/>
  <line x1="780" y1="30" x2="400" y2="30" stroke="#2ea44f" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="400" y1="30" x2="400" y2="270" stroke="#2ea44f" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Output row divider -->
  <rect x="30" y="275" width="740" height="3" rx="1.5" fill="#2ea44f" opacity="0.3"/>

  <!-- Runtime -->
  <rect x="30" y="290" width="140" height="55" rx="10" fill="#e6ffed" stroke="#2ea44f" stroke-width="1.5"/>
  <text x="100" y="312" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2ea44f">运行时</text>
  <text x="100" y="328" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#57606a">RP2040 / STM32</text>

  <!-- Simulation -->
  <rect x="190" y="290" width="140" height="55" rx="10" fill="#e6ffed" stroke="#2ea44f" stroke-width="1.5"/>
  <text x="260" y="312" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2ea44f">仿真</text>
  <text x="260" y="328" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#57606a">SIL + 场景回归</text>

  <!-- Codegen -->
  <rect x="350" y="290" width="140" height="55" rx="10" fill="#e6ffed" stroke="#2ea44f" stroke-width="1.5"/>
  <text x="420" y="312" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2ea44f">代码生成</text>
  <text x="420" y="328" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#57606a">IEC 61131-3 ST</text>

  <!-- Release -->
  <rect x="510" y="290" width="140" height="55" rx="10" fill="#e6ffed" stroke="#2ea44f" stroke-width="1.5"/>
  <text x="580" y="312" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#2ea44f">发布包</text>
  <text x="580" y="328" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" fill="#57606a">SHA256 + 全部证据</text>

  <!-- Human review -->
  <line x1="400" y1="345" x2="400" y2="370" stroke="#e8630a" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="230" y="370" width="340" height="40" rx="12" fill="#fff3e0" stroke="#e8630a" stroke-width="2"/>
  <text x="400" y="395" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="600" fill="#e8630a">人类工程师：定义边界 · 审查证据 · 批准发布</text>

  <!-- Property badges -->
  <g transform="translate(670, 295)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#8250df" opacity="0.9"/>
    <text x="47" y="13" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">可验证</text>
    <rect x="0" y="22" width="95" height="18" rx="9" fill="#0969da" opacity="0.9"/>
    <text x="47" y="35" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">可执行</text>
    <rect x="0" y="44" width="95" height="18" rx="9" fill="#2ea44f" opacity="0.9"/>
    <text x="47" y="57" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">可审计</text>
    <rect x="0" y="66" width="95" height="18" rx="9" fill="#e8630a" opacity="0.9"/>
    <text x="47" y="79" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">可复现</text>
  </g>
</svg>
