<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a4a6a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#cf222e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2ea44f"/>
    </marker>
  </defs>

  <rect width="900" height="520" rx="12" fill="#fafbfc" stroke="#e1e4e8" stroke-width="1"/>

  <!-- ===== ROW 1: .plc → Parser → AST → Semantic → IR ===== -->

  <!-- .plc Source -->
  <rect x="30" y="30" width="100" height="60" rx="10" fill="#fff3e0" stroke="#e8630a" stroke-width="2"/>
  <text x="80" y="55" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">.plc 源码</text>
  <text x="80" y="70" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">DSL 文件</text>

  <line x1="132" y1="60" x2="168" y2="60" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Parser -->
  <rect x="170" y="30" width="100" height="60" rx="10" fill="#e8f4fd" stroke="#0969da" stroke-width="2"/>
  <text x="220" y="55" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Parser</text>
  <text x="220" y="70" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">PEG 544 规则</text>

  <line x1="272" y1="60" x2="308" y2="60" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AST -->
  <rect x="310" y="30" width="80" height="60" rx="10" fill="#e8f4fd" stroke="#0969da" stroke-width="2"/>
  <text x="350" y="55" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">AST</text>
  <text x="350" y="70" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">语法树</text>

  <line x1="392" y1="60" x2="428" y2="60" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Semantic -->
  <rect x="430" y="30" width="120" height="60" rx="10" fill="#e8f4fd" stroke="#0969da" stroke-width="2"/>
  <text x="490" y="50" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Semantic</text>
  <text x="490" y="65" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">名称解析 + 约束检查</text>
  <text x="490" y="78" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#57606a">sugar 展开 + IR 降级</text>

  <line x1="552" y1="60" x2="588" y2="60" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- IR (central hub) -->
  <rect x="590" y="20" width="120" height="80" rx="14" fill="#0969da" stroke="#0550ae" stroke-width="2.5"/>
  <text x="650" y="50" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff" letter-spacing="1">IR</text>
  <text x="650" y="68" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">petgraph DiGraph</text>
  <text x="650" y="82" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">统一语义汇合点</text>

  <!-- ===== ROW 2: Four Verification Engines ===== -->

  <rect x="30" y="140" width="140" height="24" rx="12" fill="#cf222e"/>
  <text x="100" y="156" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">四引擎形式化验证</text>

  <!-- Lines from IR down to engines -->
  <line x1="650" y1="102" x2="650" y2="130" stroke="#cf222e" stroke-width="2.5"/>
  <line x1="650" y1="130" x2="170" y2="130" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="650" y1="130" x2="830" y2="130" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Safety Engine -->
  <rect x="30" y="175" width="190" height="70" rx="10" fill="#cf222e" stroke="#a40e26" stroke-width="2"/>
  <text x="125" y="198" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff">Safety Engine</text>
  <text x="125" y="214" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.85)">BMC + k-归纳</text>
  <text x="125" y="228" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.85)">conflicts_with / requires</text>
  <line x1="125" y1="130" x2="125" y2="175" stroke="#cf222e" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Liveness Engine -->
  <rect x="240" y="175" width="190" height="70" rx="10" fill="#cf222e" stroke="#a40e26" stroke-width="2"/>
  <text x="335" y="198" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff">Liveness Engine</text>
  <text x="335" y="214" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.85)">SCC + 可达性分析</text>
  <text x="335" y="228" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.85)">无死锁 / 无活锁</text>
  <line x1="335" y1="130" x2="335" y2="175" stroke="#cf222e" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Timing Engine -->
  <rect x="450" y="175" width="190" height="70" rx="10" fill="#cf222e" stroke="#a40e26" stroke-width="2"/>
  <text x="545" y="198" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff">Timing Engine</text>
  <text x="545" y="214" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.85)">关键路径分析</text>
  <text x="545" y="228" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.85)">must_complete_within</text>
  <line x1="545" y1="130" x2="545" y2="175" stroke="#cf222e" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Causality Engine -->
  <rect x="660" y="175" width="190" height="70" rx="10" fill="#cf222e" stroke="#a40e26" stroke-width="2"/>
  <text x="755" y="198" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff">Causality Engine</text>
  <text x="755" y="214" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.85)">拓扑 BFS</text>
  <text x="755" y="228" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.85)">信号链完整性</text>
  <line x1="755" y1="130" x2="755" y2="175" stroke="#cf222e" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Verification Report -->
  <rect x="340" y="265" width="220" height="36" rx="8" fill="#fce4ec" stroke="#cf222e" stroke-width="1.5"/>
  <text x="450" y="288" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#cf222e">verification_report.json</text>
  <line x1="125" y1="245" x2="125" y2="275" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="335" y1="245" x2="335" y2="275" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="545" y1="245" x2="545" y2="275" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="755" y1="245" x2="755" y2="275" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="125" y1="275" x2="755" y2="275" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="450" y1="275" x2="450" y2="265" stroke="#cf222e" stroke-width="1.5"/>

  <!-- ===== ROW 3: Multi-target outputs ===== -->

  <rect x="30" y="325" width="120" height="24" rx="12" fill="#2ea44f"/>
  <text x="90" y="341" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">多目标部署</text>

  <!-- Line from IR to outputs -->
  <line x1="710" y1="60" x2="780" y2="60" stroke="#2ea44f" stroke-width="2"/>
  <line x1="780" y1="60" x2="780" y2="320" stroke="#2ea44f" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="780" y1="320" x2="170" y2="320" stroke="#2ea44f" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Runtime Bridge -->
  <rect x="30" y="360" width="160" height="65" rx="10" fill="#e6ffed" stroke="#2ea44f" stroke-width="2"/>
  <text x="110" y="383" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a2e">Runtime Bridge</text>
  <text x="110" y="398" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="#57606a">runtime-core (no_std)</text>
  <text x="110" y="412" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="#57606a">RP2040 / STM32 固件</text>
  <line x1="110" y1="320" x2="110" y2="360" stroke="#2ea44f" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Codegen -->
  <rect x="210" y="360" width="160" height="65" rx="10" fill="#e6ffed" stroke="#2ea44f" stroke-width="2"/>
  <text x="290" y="383" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a2e">Codegen</text>
  <text x="290" y="398" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="#57606a">IEC 61131-3 ST</text>
  <text x="290" y="412" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="#57606a">OpenPLC / CODESYS</text>
  <line x1="290" y1="320" x2="290" y2="360" stroke="#2ea44f" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- SimIO -->
  <rect x="390" y="360" width="160" height="65" rx="10" fill="#e6ffed" stroke="#2ea44f" stroke-width="2"/>
  <text x="470" y="383" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a2e">SimIO</text>
  <text x="470" y="398" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="#57606a">SIL 仿真</text>
  <text x="470" y="412" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="#57606a">trace.jsonl + wave.vcd</text>
  <line x1="470" y1="320" x2="470" y2="360" stroke="#2ea44f" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- No-Board Gate -->
  <rect x="570" y="360" width="160" height="65" rx="10" fill="#e6ffed" stroke="#2ea44f" stroke-width="2"/>
  <text x="650" y="383" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a2e">No-Board Gate</text>
  <text x="650" y="398" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="#57606a">SIL vs 虚拟板对比</text>
  <text x="650" y="412" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="#57606a">p50/p95/p99 门禁</text>
  <line x1="650" y1="320" x2="650" y2="360" stroke="#2ea44f" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Release Bundle -->
  <rect x="750" y="360" width="120" height="65" rx="10" fill="#e6ffed" stroke="#2ea44f" stroke-width="2"/>
  <text x="810" y="383" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a2e">Release</text>
  <text x="810" y="398" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="#57606a">SHA256 manifest</text>
  <text x="810" y="412" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9.5" fill="#57606a">可审计发布包</text>
  <line x1="810" y1="320" x2="810" y2="360" stroke="#2ea44f" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Bottom bar -->
  <rect x="30" y="450" width="840" height="50" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="450" y="472" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#57606a">
    verification_report.json  ·  IEC 61131-3 ST  ·  firmware.uf2  ·  trace.jsonl  ·  timing_report  ·  release-bundle/
  </text>
  <text x="450" y="490" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#8b949e">所有产物可被 AI Agent 消费、审计、复现</text>
</svg>
