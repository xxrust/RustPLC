[identity]
name = "Generic conveyor"
type = "conveyor"

[[interfaces.ports]]
name = "drive"
states = ["on", "off", "reverse"]
default_state = "off"
direction = "input"
port_type = "digital"

[[interfaces.ports]]
name = "running"
states = ["on", "off"]
default_state = "off"
direction = "output"
port_type = "digital"

[[interfaces.ports]]
name = "zone"
states = ["occupied", "empty"]
default_state = "empty"
direction = "output"
port_type = "digital"

[[interfaces.ports]]
name = "jam"
states = ["on", "off"]
default_state = "off"
direction = "output"
port_type = "digital"

[interface_contract]
layer = "task_level_device"
default_feedback_policy = "feedback_required_unless_explicit_open_loop"

[[interface_contract.actions]]
name = "start"
consumes = ["drive"]
produces = ["running"]
faults = ["timeout", "reject", "motion_fault", "safety_fault", "jam", "overload"]

[[interface_contract.actions]]
name = "stop"
consumes = ["drive"]
produces = ["running"]
faults = ["timeout"]

[[interface_contract.actions]]
name = "move_until"
consumes = ["drive", "zone"]
produces = ["zone"]
faults = ["timeout", "jam", "overload", "safety_fault"]

[[interface_contract.actions]]
name = "index"
consumes = ["drive", "zone"]
produces = ["zone"]
faults = ["timeout", "jam", "overload", "safety_fault"]

[[interface_contract.actions]]
name = "reverse"
consumes = ["drive"]
produces = ["running"]
faults = ["timeout", "jam", "overload", "safety_fault"]

[[interface_contract.actions]]
name = "clear_jam"
consumes = ["drive", "jam"]
produces = ["jam"]
faults = ["reject", "safety_fault"]

[[capabilities]]
name = "transport"
kind = "process_actuator"
ports = ["drive", "running", "zone", "jam"]

[defaults.parameters]
response_time = "400ms"

[defaults.ports]
drive = "off"
running = "off"
zone = "empty"
jam = "off"

[alarm_map]
source = "conveyor_status"

[[alarm_map.entries]]
code = "CONVEYOR_TIMEOUT"
condition = "timeout"
severity = "fault"
recoverable = true
description = "Conveyor action timed out"

[[alarm_map.entries]]
code = "CONVEYOR_REJECT"
condition = "reject"
severity = "fault"
recoverable = true
description = "Conveyor command rejected"

[[alarm_map.entries]]
code = "CONVEYOR_MOTION_FAULT"
condition = "motion_fault"
severity = "fault"
recoverable = true
description = "Conveyor motion fault"

[[alarm_map.entries]]
code = "CONVEYOR_SAFETY_FAULT"
condition = "safety_fault"
severity = "safety"
recoverable = false
description = "Conveyor safety fault"

[[alarm_map.entries]]
code = "CONVEYOR_JAM"
condition = "jam"
severity = "fault"
recoverable = true
description = "Conveyor jam detected"

[[alarm_map.entries]]
code = "CONVEYOR_OVERLOAD"
condition = "overload"
severity = "fault"
recoverable = true
description = "Conveyor overload detected"

[verification_contract]
safety = ["zone occupancy capacity must not be exceeded", "jam.on conflicts_with continued drive"]
liveness = ["move_until/index must complete or route to timeout/fault bucket"]

[codegen_support]
unsupported_targets = ["st", "runtime-core"]
notes = "Conveyor actions consume drive capability; raw motor.run writes are not equivalent."
